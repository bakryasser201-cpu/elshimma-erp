spring.application.name=ElShimmaERP

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/elshimma_erp
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
# Required: strong Base64-encoded 256-bit+ secret.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Required initial admin password for automatic admin creation.
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD}
