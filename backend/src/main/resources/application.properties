spring.application.name=ElShimmaERP

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/elshimma_erp
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger UI
springdoc.swagger-ui.persist-authorization=true

# JWT
# Required: strong Base64-encoded 256-bit+ secret.
app.jwt.secret=bXlTdXBlclNlY3JldEtleTEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2
app.jwt.expiration-ms=86400000

# Required initial admin password for automatic admin creation.
app.admin.initial-password=admin123
